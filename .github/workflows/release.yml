# Called by a mod's own workflow on a version tag (DRH-Mods-Template's
# .github/workflows/release.yml): packs the mod with the latest DRH Launcher
# and drafts a GitHub release with its zip and index entry.
name: Release a DRH mod

on:
  workflow_call:
    inputs:
      drhl-version:
        description: A DRH Launcher release tag (a pre-release, to test one); empty, the latest.
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download DRH Launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRHL_VERSION: ${{ inputs.drhl-version }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download $DRHL_VERSION --repo Tutez64/DRH-Launcher --pattern '*.AppImage' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mv ./*.AppImage drhl.AppImage
          chmod +x drhl.AppImage
          # The launcher links fontconfig even without its window.
          ldconfig -p | grep -q libfontconfig.so.1 || { sudo apt-get update && sudo apt-get install -y libfontconfig1; }

      # The runner has no FUSE: the AppImage extracts itself instead.
      # On a tag that is not v<version>, --pack-mod refuses to pack.
      - name: Pack
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: '"$RUNNER_TEMP/drhl.AppImage" --pack-mod . "$RUNNER_TEMP/dist"'

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/*
